name: LiminalGenerator
options:
  bundleIdPrefix: com.gapco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "XM2SC5YZ8C"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  Liminal Generator:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiminalGenerator
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_NAME: "Liminal Generator"
        PRODUCT_BUNDLE_IDENTIFIER: com.gapco.LiminalGenerator
        INFOPLIST_FILE: LiminalGenerator/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"

  LiminalGeneratorUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiminalGeneratorUITests
    settings:
      base:
        PRODUCT_NAME: "LiminalGeneratorUITests"
        PRODUCT_BUNDLE_IDENTIFIER: com.gapco.LiminalGeneratorUITests
        SWIFT_EMIT_LOC_STRINGS: NO
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: "Liminal Generator"
    dependencies:
      - target: Liminal Generator

schemes:
  Liminal Generator:
    build:
      targets:
        Liminal Generator: all
        LiminalGeneratorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiminalGeneratorUITests
    archive:
      config: Release
