<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.primary');
            overflow: hidden; /* Prevent scrolling during splash */
        }

        /* CRT Effects */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            pointer-events: none;
        }

        .noise {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 40;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .chromatic-aberration {
            text-shadow: 
                2px 0 0 rgba(255,0,0,0.5), 
                -2px 0 0 rgba(0,0,255,0.5);
        }

        .glow {
            filter: drop-shadow(0 0 8px theme('colors.primary-fixed-dim'));
        }

        /* Animations */
        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse-text {
            animation: pulse-opacity 2s infinite;
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, 0); }
            60% { clip-path: inset(20% 0 60% 0); transform: translate(2px, 2px); }
            80% { clip-path: inset(70% 0 20% 0); transform: translate(-2px, -2px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(2px, 0); }
        }

        .glitch-hover:hover {
            animation: glitch-anim 0.3s infinite;
            color: theme('colors.primary-fixed-dim');
        }

        /* Progress Bar Animation */
        @keyframes progress {
            0% { content: "[          ]"; }
            20% { content: "[||        ]"; }
            40% { content: "[||||      ]"; }
            60% { content: "[||||||    ]"; }
            80% { content: "[||||||||  ]"; }
            100% { content: "[||||||||||]"; }
        }
        
        #buffer-bar::after {
            content: "[          ]";
            animation: progress 3s steps(5, end) infinite;
        }
