<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* CRT Overlay effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Glitch Animation for text */
        @keyframes glitch {
            0% {
                text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), -0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            }
            14% {
                text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), -0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            }
            15% {
                text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            49% {
                text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            50% {
                text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            99% {
                text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            100% {
                text-shadow: -0.025em 0 0 rgba(255, 0, 0, 0.75), -0.025em -0.025em 0 rgba(0, 255, 0, 0.75), -0.025em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
        }
        
        .glitch-text:hover {
            animation: glitch 1s infinite;
        }

        /* Tape Deck Button Style */
        .tape-btn {
            border-bottom: 2px solid theme('colors.outline-variant');
            transition: all 0.1s ease;
        }
        .tape-btn:active {
            border-bottom-width: 0px;
            transform: translateY(2px);
        }

        /* Blinking Cursor */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        /* Progress Bar Animation */
        @keyframes loading-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: loading-bar 4s linear forwards;
        }

        /* Waveform Animation */
        @keyframes wave {
            0% { transform: scaleY(0.1); }
            50% { transform: scaleY(1); }
            100% { transform: scaleY(0.1); }
        }
        .wave-bar {
            animation: wave 1.2s infinite ease-in-out;
            transform-origin: bottom;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; }
        .wave-bar:nth-child(8) { animation-delay: 0.7s; }
        
        /* Transition States */
        #encoding-state { display: flex; }
        #complete-state { display: none; }
        
        body.is-complete #encoding-state { display: none; }
        body.is-complete #complete-state { display: flex; }

    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center bg-background px-margin-mobile">

<script>
        // Simulate rendering process
        document.addEventListener('DOMContentLoaded', () => {
            const bufferSpan = document.getElementById('buffer-pct');
            let pct = 0;
            
            const interval = setInterval(() => {
                pct += Math.floor(Math.random() * 5) + 1;
                if(pct > 100) pct = 100;
                bufferSpan.innerText = pct;
                
                if(pct >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.body.classList.add('is-complete');
                    }, 500); // slight delay after 100%
                }
            }, 100);
        });
    </script>
