<style>
        body {
            background-color: #000000;
        }
        
        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.1)
            );
            background-size: 100% 4px;
            opacity: 0.15;
        }

        /* CRT Flicker */
        @keyframes crtFlicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.85; }
            10% { opacity: 0.95; }
            100% { opacity: 1; }
        }
        .crt-effect {
            animation: crtFlicker 0.15s infinite;
        }

        /* Glitch effect on hover for certain elements */
        .glitch-hover:hover {
            text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px) }
            40% { transform: translate(-1px, -1px) }
            60% { transform: translate(2px, 1px) }
            80% { transform: translate(1px, -1px) }
            100% { transform: translate(0) }
        }

        /* Tape Deck Button */
        .deck-btn {
            border-bottom: 2px solid #2a2a2a;
            transition: all 0.1s ease;
        }
        .deck-btn:active {
            border-bottom: 0px solid transparent;
            transform: translateY(2px);
        }

        /* Analog Slider overrides */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            background: #00e61b;
            cursor: pointer;
            border-radius: 0;
            border: 1px solid #131313;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #2a2a2a;
            border-radius: 0;
        }
        
        .blinking-cursor {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Hide scrollbar for swiping */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>

<span class="font-display-vcr text-headline-lg-mobile uppercase tracking-tighter">RENDER &amp; SHARE</span>
</button>

<!-- Script for basic interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const drumsToggle = document.getElementById('drums-toggle');
            const drumsControls = document.getElementById('drums-controls');

            drumsToggle.addEventListener('change', (e) => {
                if(e.target.checked) {
                    drumsControls.style.opacity = '1';
                    drumsControls.style.pointerEvents = 'auto';
                } else {
                    drumsControls.style.opacity = '0.3';
                    drumsControls.style.pointerEvents = 'none';
                }
            });
        });
    </script>
